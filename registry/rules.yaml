- id: R-BOOT-001
  legacy_id: R1
  title: Boot reads only the four files
  text: >-
    At session start read, in order, and stop: the rule file; only the NEXT ACTION block of
    PROGRESS.md; the PLAN.md step list, to find the first unchecked step; only the INDEX.md rows for
    the files that step touches. That is the whole context load. Do not grep, tour the tree, read
    `src/` "to get oriented", or re-derive anything the files already state. If they are
    insufficient, that is a bug in them — fix the file, then continue.
  scope: [all-projects]
  enforcement: rule-file
  where: seeds/agi-standards/AGENTS.md
  sources:
    - seeds/agi-standards/AGENTS.md R1
  evidence:
  checked_on:
  checked_at:
  review_by: 2026-12-31
  status: active
  owner: director

