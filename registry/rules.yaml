# Proposals, 2026-10-13. Sources: the Agent Team Process Audit,
# which measured fog_of_war at commit abfb54c on 2026-10-12, plus the pool tips and official pages cited per rule.
# Together they replace the 11 rules that name PLAN.md or PROGRESS.md, so the project template can use the
# state card, plan/queue.json and the progress/ files.

- id: R-BOOT-004
  title: Boot from the state card
  text: >-
    At session start, act from the state card that the sdlc-core hook adds. It shows the branch, the
    last verify, the next ready step, the questions waiting on the director, the size budgets and
    progress/now.md. Then read only the step file plan/steps/S<n>.md and the files in the step's
    context list. Do not grep, tour the tree, or read the queue or the git log to get oriented. If
    the card and the step file are not enough, that is a bug in them: fix the file, then continue.
  scope: [all-projects]
  enforcement: hook
  where: plugins/sdlc-core/scripts/state-card.sh
  supersedes: [R-BOOT-001]
  sources:
    - "Agent Team Process Audit, finding F1 and workstream B (state card)"
  evidence: "fog_of_war at abfb54c: the dispatcher read about 55K to 145K tokens before its first step, and PLAN.md was 1.19 MB."
  checked_on:
  checked_at:
  review_by: 2027-01-31
  status: proposed
  owner: director

- id: R-PLAN-004
  title: Steps live in the queue
  text: >-
    No task begins without its steps in plan/queue.json. Each open step has a step file
    plan/steps/S<n>.md of at most 40 lines: goal, acceptance criteria, files, out of scope. When the
    director gives a task and the queue has no step for it, write the steps first and confirm them
    before writing code.
  scope: [all-projects]
  enforcement: rule-file
  where: templates/project/AGENTS.md
  supersedes: [R-PLAN-001]
  sources:
    - pool P25
    - pool P26
    - "Agent Team Process Audit, workstream A (queue as data)"
  evidence: "fog_of_war at abfb54c: 203 of 229 steps in PLAN.md were done but still sat in the file every dispatcher read."
  checked_on:
  checked_at:
  review_by: 2027-01-31
  status: proposed
  owner: director

- id: R-PLAN-005
  title: Each step fits one sitting and its check tests behavior
  text: >-
    Each step must fit one sitting. Its verify field names a command that tests behavior, with an
    exit code or an observable result. A prose step has verify none and, if it matters, a reviewer.
    Never check prose with grep.
  scope: [all-projects]
  enforcement: rule-file
  where: templates/project/AGENTS.md
  supersedes: [R-PLAN-002]
  sources:
    - pool P27
    - pool P28
