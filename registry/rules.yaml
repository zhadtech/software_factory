  review_by: 2027-01-31
  status: proposed
  owner: director

- id: R-PLAN-006
  title: The commit is the step log
  text: >-
    In the same turn a step is done: remove it from plan/queue.json, rewrite progress/now.md, and
    commit with the trailers Step:, Tier:, Verify: and Open:. The commit is the step log; there is no
    hand-written progress log. Read history with git log --grep='^Step: S<n>'.
  scope: [all-projects]
  enforcement: rule-file
  where: templates/project/AGENTS.md
  supersedes: [R-PLAN-003]
  sources:
