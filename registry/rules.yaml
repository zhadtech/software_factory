  review_by: 2027-01-31
  status: proposed
  owner: director

- id: R-SESS-007
  title: A fresh context for each step
  text: >-
    Finish the current step and record it, then start the next step in a fresh context with /clear.
    Do not stop at a fixed context percentage. Do not rely on compaction to carry state between
    steps: the files and the state card carry it.
  scope: [all-projects]
  enforcement: rule-file
  where: templates/project/AGENTS.md
  supersedes: [R-SESS-002, R-SESS-003]
