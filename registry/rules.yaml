    - "Agent Team Process Audit, workstreams E and G"
  evidence: "Anthropic's harness post (2026-03-24) says Opus 4.5 largely removed context anxiety and the harness dropped context resets."
  checked_on:
  checked_at:
  review_by: 2027-01-31
  status: proposed
  owner: director

