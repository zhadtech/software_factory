- id: R-EXPO-002
  title: Change generated native folders through app config
  text: >-
    If `ios/` and `android/` are listed in `.gitignore`, `npx expo prebuild` generates them from the
    app config, and the next `npx expo prebuild --clean` erases hand edits. Make native changes in
    `app.json`, `app.config.*` or a config plugin instead. If the project commits those folders,
    edit them directly.
