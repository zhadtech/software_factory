- id: R-EXPO-003
  title: Keep secrets out of EXPO_PUBLIC_ variables
  text: >-
    Only variables named `EXPO_PUBLIC_...` are built into the app, and anyone can read them from the
    installed app. Never put a secret, such as a private API key, in one. Keep secrets on a server.
